# Advisory: all offline tests + coverage for both apps. Reports, never blocks a merge.
# Each suite runs even if an earlier one fails, so the summary always shows all results.
name: Tests (advisory)

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt coverage

      - name: Backend tests + coverage (target 90%)
        continue-on-error: true
        run: |
          coverage run -m unittest -q
          echo "### Backend coverage" >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || echo "::warning::Backend coverage below 90%"

      - name: SpaceLapse index builder tests (existing)
        continue-on-error: true
        run: python -m unittest tests/test_release_index.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: JS unit + component tests + coverage (lines 90%, branches 80%)
        continue-on-error: true
        run: |
          set -o pipefail
          npm run --silent coverage:viewer | tee coverage.txt
          { echo "### Frontend coverage"; echo '```'; grep -E "file|\.js|all files" coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
